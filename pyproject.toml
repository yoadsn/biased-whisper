[project]
name = "biased-whisper"
version = "0.1.0"
description = "Harness for probing and biasing digit vs cardinal-text output in Hebrew Whisper models"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "torch>=2.4",
  "transformers>=4.45",
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "pyyaml>=6",
  "huggingface_hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bw = "bwhisper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bwhisper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
