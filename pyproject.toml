[project]
name = "biased-whisper"
version = "0.1.0"
description = "Harness for probing and biasing digit vs cardinal-text output in Hebrew Whisper models"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "torch>=2.8,<2.9",
  "transformers>=4.45,<5",
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "pyyaml>=6",
  "huggingface_hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bw = "bwhisper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bwhisper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA 12.8 runs on the A40 server's CUDA-12.9 driver; current PyPI wheels
# require CUDA 13. Keep other platforms on their normal PyPI torch wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
